name: video-summarizer

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-observability: &observability
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  redis:
    image: redis:7-alpine
    container_name: vs-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks: [vs-net]

  gateway:
    build:
      context: .
      dockerfile: app/gateway/Dockerfile
    container_name: vs-gateway
    volumes:
      - vs-data:/data
    environment:
      <<: *observability
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      INGEST_URL: http://ingest:8001
      CORS_ORIGINS: http://localhost,http://localhost:80,https://${DOMAIN:-},http://${DOMAIN:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: [vs-net]

  ingest:
    build:
      context: .
      dockerfile: app/ingest/Dockerfile
    container_name: vs-ingest
    volumes:
      - vs-data:/data
      - hf-cache:/root/.cache/huggingface
      - ./cookies.txt:/cookies.txt:ro
    environment:
      <<: *observability
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      KEEP_MEDIA: ${KEEP_MEDIA:-1}
      COOKIES_FILE: ${COOKIES_FILE:-/cookies.txt}
      EXTRACTOR_ARGS: ${EXTRACTOR_ARGS:-}
      ENABLE_JS_RUNTIMES: ${ENABLE_JS_RUNTIMES:-0}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks: [vs-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vs-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks: [vs-net]

  certbot:
    image: certbot/certbot
    container_name: vs-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done;'"
    networks: [vs-net]

volumes:
  vs-data:
  redis-data:
  hf-cache:
  certbot-conf:
  certbot-www:

networks:
  vs-net:
    driver: bridge
